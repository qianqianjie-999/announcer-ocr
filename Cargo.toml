[package]
name = "announce-rs"
version = "1.0.0"
edition = "2021"
description = "叫号屏摄像头 OCR 语音播报（Rust 版，低内存）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
